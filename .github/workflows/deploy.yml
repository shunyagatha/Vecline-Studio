# Build Vecline Studio and publish it to GitHub Pages.
#
# The studio is a static site with no backend, so "deploy" is genuinely just
# uploading `dist/`. The build runs here rather than committing build output, so
# the repository stays source-only and the published bundle always matches the
# commit it came from.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The engine ships separately, on its own release cadence, and the Studio
  # bundles it at build time — so a new `vecline` on npm changes nothing here
  # until something rebuilds, and nothing did: the site served engine 2.0.0
  # while npm was on 2.1.1.
  #
  # Be precise about what that cost, because most of a release does not reach
  # here. The Studio bundles `vecline/core`, the portable half. APNG animation,
  # the decoder error messages and the heap watchdog are all node-only paths and
  # were never in this bundle. What 2.1.x actually gives the browser is the
  # tracer memory fix in trace.ts — real, but one item, not a backlog.
  #
  # This trigger only redeploys, which is the part worth being blunt about:
  # `npm ci` installs what the lockfile pins, so the engine version changes when
  # the lockfile does, not when this fires. On its own it was never going to
  # close the gap it was added for.
  #
  # `engine-update.yml` is what closes it — a scheduled job in this repository
  # that compares the lockfile pin against npm and opens a PR to move it. That
  # needs no cross-repo credential, where dispatching from the engine repository
  # would have meant a fine-grained PAT in that repository's secrets holding
  # write access to this one, with rotation and leak risk attached.
  #
  # Kept regardless: it is still a free way to force a rebuild of the current pin.
  repository_dispatch:
    types: [engine-released]

# Pages needs these; nothing else in the workflow writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A type error should stop a deploy, not ship broken UI.
      - run: npm run typecheck

      - run: npm run build
        env:
          # Stamps the service worker so returning visitors get the new build
          # instead of a stale cached shell.
          BUILD_ID: ${{ github.sha }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
