<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vecline Studio">
  <title>Vecline Studio</title>
  <!--
    The mark is the product in one glyph: a stepped pixel staircase on the left
    resolving into a smooth Bézier on the right, with the control handles left
    visible — the moment raster becomes editable vector, which is the whole tool.
  -->
  <rect width="512" height="512" rx="112" fill="#1B1220"/>

  <!-- The raster half: a coarse staircase, deliberately hard-edged. -->
  <g fill="#0A6E8A">
    <rect x="96" y="316" width="44" height="44"/>
    <rect x="140" y="272" width="44" height="44"/>
    <rect x="184" y="228" width="44" height="44"/>
    <rect x="228" y="184" width="44" height="44"/>
  </g>

  <!-- The vector half: the same rise, but as one continuous curve. -->
  <path d="M118 338 C 210 338 246 206 338 206"
        fill="none" stroke="#D1006F" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Control handles, the signature of something you can still edit. -->
  <g stroke="#EFE9EF" stroke-width="10" fill="none" opacity="0.85">
    <path d="M118 338 L 210 338"/>
    <path d="M338 206 L 246 206"/>
  </g>
  <g fill="#EFE9EF">
    <circle cx="118" cy="338" r="24"/>
    <circle cx="338" cy="206" r="24"/>
  </g>
  <g fill="#1B1220" stroke="#EFE9EF" stroke-width="9">
    <rect x="196" y="324" width="28" height="28" rx="3"/>
    <rect x="232" y="192" width="28" height="28" rx="3"/>
  </g>
</svg>
